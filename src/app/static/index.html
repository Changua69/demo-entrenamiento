<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Promocionamos esta canción?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef5; --panel:#ffffff; --ink:#1a1d3a; --mute:#5d6285; --line:#d6d9e8;
  --accent:#3b4bdb; --go:#1b7f55; --stop:#b93a28; --band:#c9cffa;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12142b; --panel:#1b1e3d; --ink:#eceefb; --mute:#a2a8d1; --line:#2f3463;
    --accent:#8c98ff; --go:#4cc994; --stop:#ff8b78; --band:#343b86; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 28px;max-width:60ch}
.grid{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.fader{margin-bottom:18px}
.fader label,.field label{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:6px}
.fader output{font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:8px}
input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600}
button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#12142b}}
button:disabled{opacity:.6;cursor:wait}
.result{position:sticky;top:20px}
.verdict{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.verdict.go{color:var(--go)} .verdict.stop{color:var(--stop)}
.why{color:var(--mute);margin:0 0 20px}
.scale{position:relative;height:10px;border-radius:99px;background:var(--line);margin:34px 6px 8px}
.band{position:absolute;top:0;height:100%;background:var(--band);border-radius:99px}
.mark,.cut{position:absolute;top:-8px;width:3px;height:26px;border-radius:2px}
.mark{background:var(--accent);width:5px}
.cut{background:var(--ink)}
.tag{position:absolute;top:-30px;transform:translateX(-50%);font-size:.78rem;white-space:nowrap;font-weight:600}
.cut .tag{top:30px;color:var(--mute)}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:.78rem;margin:0 2px 18px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dt{color:var(--mute)} dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--mute)}
.error{color:var(--stop);font-weight:600}
.model{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--mute)}
.model b{color:var(--ink)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>¿Será un hit esta canción?</h1>
  <p class="sub">Describa la canción tal como será al lanzarla. El modelo estima su popularidad y le dice si conviene invertir en promoción.</p>

  <div class="grid">
    <div class="panel">
      <div id="faders"></div>
      <div class="row">
        <div class="field"><label for="tempo">Tempo (BPM)</label><input id="tempo" type="number" min="40" max="250" step="1" value="118"></div>
        <div class="field"><label for="duracion_min">Duración (min)</label><input id="duracion_min" type="number" min="0.5" max="15" step="0.1" value="3.4"></div>
        <div class="field"><label for="volumen_db">Volumen (dB)</label><input id="volumen_db" type="number" min="-60" max="5" step="0.5" value="-6.5"></div>
        <div class="field"><label for="anio">Año de lanzamiento</label><input id="anio" type="number" min="1990" max="2035" step="1" value="2026"></div>
        <div class="field"><label for="genero">Género</label>
          <select id="genero">
            <option value="pop">Pop</option><option value="urbano" selected>Urbano</option>
            <option value="rock">Rock</option><option value="electronica">Electrónica</option><option value="indie">Indie</option>
          </select>
        </div>
      </div>
      <label class="check"><input id="colaboracion" type="checkbox" checked> Es una colaboración</label>
      <button id="enviar" type="button">Evaluar canción</button>
    </div>

    <aside class="panel result" aria-live="polite">
      <div id="salida"><p class="empty">Complete los datos y pulse «Evaluar canción» para ver la decisión.</p></div>
      <div class="model" id="modelo">Cargando información del modelo…</div>
    </aside>
  </div>
  <p class="sub" style="margin-top:24px">Documentación técnica de la API: <a href="/docs">/docs</a></p>
</main>

<script>
const FADERS = [
  ["bailabilidad","Bailabilidad",.72],["energia","Energía",.65],
  ["valencia","Valencia (positividad)",.55],["acustica","Acústica",.12]
];
const $ = id => document.getElementById(id);
$("faders").innerHTML = FADERS.map(([id,t,v]) =>
  `<div class="fader"><label for="${id}">${t}<output id="o_${id}">${v.toFixed(2)}</output></label>
   <input id="${id}" type="range" min="0" max="1" step="0.01" value="${v}"></div>`).join("");
FADERS.forEach(([id]) => $(id).addEventListener("input", e => $("o_"+id).textContent = (+e.target.value).toFixed(2)));

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function leerCancion(){
  const n = id => parseFloat($(id).value);
  return {
    bailabilidad:n("bailabilidad"), energia:n("energia"), valencia:n("valencia"), acustica:n("acustica"),
    tempo:n("tempo"), duracion_min:n("duracion_min"), volumen_db:n("volumen_db"),
    anio:parseInt($("anio").value,10), colaboracion:$("colaboracion").checked?1:0, genero:$("genero").value
  };
}

function escala(valor, corte, min, max, banda, fmt, etiquetaCorte){
  const p = x => Math.min(100, Math.max(0, (x-min)/(max-min)*100));
  const b = banda ? `<div class="band" style="left:${p(banda[0])}%;width:${p(banda[1])-p(banda[0])}%"></div>` : "";
  return `<div class="scale" role="img" aria-label="Valor ${fmt(valor)}, ${etiquetaCorte} ${fmt(corte)}">
    ${b}<div class="cut" style="left:${p(corte)}%"><span class="tag">${etiquetaCorte} ${fmt(corte)}</span></div>
    <div class="mark" style="left:${p(valor)}%"><span class="tag" style="color:var(--accent)">${fmt(valor)}</span></div></div>
    <div class="ends"><span>${fmt(min)}</span><span>${fmt(max)}</span></div>`;
}

function pintar(r){
  const clase = r.promocionar ? "go" : "stop";
  const titulo = r.promocionar ? "Sí, será un hit" : "No, no será un hit";
  let grafico, detalle;
  if (r.tarea === "regresion"){
    grafico = escala(r.popularidad_esperada, r.corte_promocion, 0, 100, r.rango, v => v.toFixed(v%1?1:0), "corte");
    detalle = `<dt>Popularidad esperada</dt><dd>${r.popularidad_esperada}</dd>
               <dt>Rango probable</dt><dd>${r.rango[0]} a ${r.rango[1]}</dd>
               <dt>Corte para promocionar</dt><dd>${r.corte_promocion}</dd>`;
  } else {
    grafico = escala(r.probabilidad_hit, r.umbral, 0, 1, null, v => v.toFixed(2), "umbral");
    detalle = `<dt>Probabilidad de hit</dt><dd>${(r.probabilidad_hit*100).toFixed(1)} %</dd>
               <dt>Umbral de decisión</dt><dd>${(r.umbral*100).toFixed(0)} %</dd>`;
  }
  $("salida").innerHTML = `<div class="verdict ${clase}">${titulo}</div><p class="why">${esc(r.explicacion)}</p>${grafico}<dl>${detalle}</dl>`;
}

function errorMsg(status, cuerpo){
  if (status === 422 && Array.isArray(cuerpo.detail))
    return cuerpo.detail.map(d => `${(d.loc||[]).slice(-1)[0]}: ${d.msg}`).join("; ");
  if (status === 503) return "El servicio no tiene modelo. Falta models/modelo.pkl en el repositorio.";
  return cuerpo.detail || "Error inesperado del servicio.";
}

$("enviar").addEventListener("click", async () => {
  const btn = $("enviar"); btn.disabled = true; btn.textContent = "Evaluando…";
  try{
    const res = await fetch("/predecir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(leerCancion())});
    const cuerpo = await res.json().catch(() => ({}));
    if (!res.ok) $("salida").innerHTML = `<p class="error">${esc(errorMsg(res.status, cuerpo))}</p>`;
    else pintar(cuerpo);
  }catch(e){
    $("salida").innerHTML = `<p class="error">No se pudo conectar con el servicio. Si está en Render, espere un minuto y repita.</p>`;
  }finally{ btn.disabled = false; btn.textContent = "Evaluar canción"; }
});

(async () => {
  try{
    const f = await (await fetch("/modelo")).json();
    const d = f.desempeno || {}, lb = f.linea_base || {};
    const medida = f.tarea === "regresion"
      ? `Error medio (MAE) <b>${d.mae}</b> frente a <b>${lb.mae}</b> de la línea base`
      : `Costo <b>${d.costo}</b> frente a <b>${lb.costo}</b> de la línea base`;
    $("modelo").innerHTML = `Modelo: <b>${esc(f.nombre)}</b> (${esc(f.tarea)}).<br>${medida}, evaluado en ${esc((f.prueba||{}).periodo||"2020-2025")}.`;
  }catch(e){ $("modelo").textContent = "No se pudo leer la ficha del modelo."; }
})();
</script>
</body>
</html>
