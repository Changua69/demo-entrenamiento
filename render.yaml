# Render: New + > Blueprint > seleccionar su repositorio.
services:
  - type: web
    name: demo-reg-clas-canciones1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.interfaz:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
